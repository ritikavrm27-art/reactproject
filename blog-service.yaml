apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-service
  namespace: blog-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-service
  template:
    metadata:
      labels:
        app: blog-service
    spec:
      containers:
      - name: blog-service
        image: ritiverma/reactproject-blog-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8001
        env:
        - name: DB_HOST
          value: blog-db
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          value: postgres
        - name: DB_NAME
          value: blogs_golen
---
apiVersion: v1
kind: Service
metadata:
  name: blog-service
  namespace: blog-app
spec:
  type: NodePort
  selector:
    app: blog-service
  ports:
    - port: 8001
      targetPort: 8001
      nodePort: 30001