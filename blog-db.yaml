apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: blog-db-pvc
  namespace: blog-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-db
  namespace: blog-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog-db
  template:
    metadata:
      labels:
        app: blog-db
    spec:
      containers:
      - name: blog-db
        image: postgres:15
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: blogs_golen
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: blog-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: blog-db
  namespace: blog-app
spec:
  selector:
    app: blog-db
  ports:
    - port: 5432
      targetPort: 5432